services:
  - type: web
    name: booknook-client
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: booknook
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: NEXT_PUBLIC_API_URL
        value: https://booknook-api-oxdx.onrender.com
      - key: NEXT_PUBLIC_IMGBB_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
